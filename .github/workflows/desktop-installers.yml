name: Desktop installers
on:
  workflow_dispatch:
  push:
    branches: ['desktop/**']
    paths: ['desktop/**', '.github/workflows/desktop-installers.yml']
  pull_request:
    paths: ['desktop/**', '.github/workflows/desktop-installers.yml']
permissions:
  contents: read
jobs:
  package:
    name: ${{ matrix.platform }} installer
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            os: windows-2022
          - platform: Linux
            os: ubuntu-24.04
          - platform: macOS
            os: macos-15-intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux native Qt and packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y qt6-base-dev qt6-base-dev-tools libgl1-mesa-dev libxkbcommon-dev libxcb-cursor0 dpkg-dev xvfb
      - name: Windows and macOS native Qt
        if: runner.os != 'Linux'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          archives: 'qtbase qttools'
          cache: true
      - name: Windows installer tooling
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path (Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'))) { choco install innosetup --no-progress -y }
      - name: Windows build, tests and installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./desktop/packaging/build-windows.ps1 -QtPrefix $env:QT_ROOT_DIR
          python desktop/tests/integration.py desktop/vendor/windows-node/whippetd.exe
      - name: Linux build, tests and installers
        if: runner.os == 'Linux'
        run: xvfb-run -a bash desktop/packaging/build-unix.sh
      - name: macOS build, tests and DMG
        if: runner.os == 'macOS'
        run: bash desktop/packaging/build-unix.sh
      - name: Package checksums
        shell: python
        run: |
          import hashlib, pathlib
          root = pathlib.Path('desktop/dist')
          packages = sorted(p for p in root.iterdir() if p.is_file())
          (root / 'SHA256SUMS.txt').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest() + '  ' + p.name + '\n' for p in packages))
      - name: Verify Linux installed package
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y ./desktop/dist/*.deb
          xvfb-run -a /usr/bin/Whippet --regtest --smoke-test --data-dir "$RUNNER_TEMP/whippet-install-test"
          test -s "$RUNNER_TEMP/whippet-install-test/chain/regtest/regtest/wallet.dat"
      - name: Verify macOS deployed app
        if: runner.os == 'macOS'
        run: |
          cmake --install desktop/build --prefix "$RUNNER_TEMP/whippet-stage"
          env -u QT_PLUGIN_PATH -u QML2_IMPORT_PATH "$RUNNER_TEMP/whippet-stage/Whippet.app/Contents/MacOS/Whippet" --regtest --smoke-test --data-dir "$RUNNER_TEMP/whippet-install-test"
          test -s "$RUNNER_TEMP/whippet-install-test/chain/regtest/regtest/wallet.dat"
      - uses: actions/upload-artifact@v4
        with:
          name: Whippet-${{ matrix.platform }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.zip
            desktop/dist/*.dmg
            desktop/dist/*.deb
            desktop/dist/*.tar.gz
            desktop/dist/SHA256SUMS.txt
          if-no-files-found: error
